[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-moe"
version = "1.0.0"
description = "Graph-Aware Mixture-of-Experts for multimodal anomaly detection in microservice systems"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "UG-MoE Team"},
]
license = {text = "MIT"}

[project.dependencies]
torch >= 2.0.0
dgl >= 2.0.0
numpy >= 1.24.0
scipy >= 1.10.0
scikit-learn >= 1.3.0
matplotlib >= 3.7.0

[project.optional-dependencies]
dev = [
    "pytest >= 7.0.0",
    "black >= 23.0.0",
    "flake8 >= 6.0.0",
    "isort >= 5.12.0",
]

[tool.setuptools.packages.find]
where = ["project"]
include = ["src*", "tracks*", "experiments*", "preprocessing*", "vendor*"]

[tool.setuptools.package-data]
project = ["*.json", "*.pkl", "*.bin"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
